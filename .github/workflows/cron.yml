name: Executar Cron Shrine

on:
  schedule:
    - cron: '0 23 * * 2'

  workflow_dispatch:

jobs:
  chamar-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar requisição para o Railway
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -s -S --max-time 120 "https://bot-production-2559.up.railway.app/cron-shrine?senha=${CRON_SECRET}"