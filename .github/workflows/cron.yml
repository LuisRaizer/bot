name: Executar Cron Shrine

on:
  schedule:
    - cron: '0 16 * * 2'

  workflow_dispatch:

jobs:
  chamar-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar requisição para o Render
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -s -S --max-time 120 "https://bot-28g0.onrender.com/cron-shrine?senha=${CRON_SECRET}"